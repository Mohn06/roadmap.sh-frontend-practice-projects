<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible-Form-UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section>
            <form>
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="What should we call you?" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="sample@email.com" aria-invalid="true" aria-describedby="email-error" required>
                <p id="email-error" role="alert">Email is already taken</p>
            <div class="password-container">
                <label for="password">Enter Password</label>
                <input type="password" id="password" name="password" placeholder="xxxxxxxxxx">
                <button type="button" class="show-password" aria-label="Passwrod is hidden" aria-pressed="">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <div class="password-container">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="xxxxxxxxxx">

                <button type="button" class="show-password" aria-label="Password is hidden" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off preview-icon"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                </button>
            </div>
                <button type="submit" class="update-profile">Update Profile</button>
            </form>

        </section>

           

        <section class="profile-container">
            
                <div class="progress-bar">65%</div>

                <h2>Profile Completeness</h2>

            <ul>
                <li class="completed">Create Account</li>
                <li class="completed">Update Roadmap Progress</li>
                <li class="completed">Setup Public Profile</li>
                <li>Complete your first project</li>
                <li>Invite your Friends</li>
            </ul>

        </section>

    </main>


</body>
</html>
