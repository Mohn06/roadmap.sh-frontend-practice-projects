<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Simple Tabs</title>
</head>
<body>
    <div class="tabs">
        <div class="tab-header">
            <button class="tab-button active" data-tab="tab1">First Tab</button>
            <button class="tab-button" data-tab="tab2">Second Tab</button>
            <button class="tab-button" data-tab="tab3">Third Tab</button>
            <button class="tab-button" data-tab="tab4">Fourth Tab</button>
            <button class="tab-button" data-tab="tab5">Fifth Tab</button>
         </div>

        <div class="tab-content">
            <div class="tab-panel active" id="tab1">
                <h2>Content for Tab 1</h2>
                <p>This is the content for Tab 1.</p>
            </div>
            <div class="tab-panel" id="tab2">
                <h2>Content for Tab 2</h2>
                <p>This is the content for Tab 2.</p>
            </div>
            <div class="tab-panel" id="tab3">
                <h2>Content for Tab 3</h2>
                <p>This is the content for Tab 3.</p>
            </div>
            <div class="tab-panel" id="tab4">
                <h2>Content for Tab 4</h2>
                <p>This is the content for Tab 4.</p>
            </div>
            <div class="tab-panel" id="tab5">
                <h2>Content for Tab 5</h2>
                <p>This is the content for Tab 5.</p>
            </div>
        </div>
    </div>  
     <script src="script.js"></script>
</body>
</html>
