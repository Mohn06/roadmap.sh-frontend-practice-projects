<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tooltip-Ui</title>
</head>
<body>
    <div class="card">
        <ul class="nav">
            <li class="tip-fade">
                <a href="#" class="nav-item" aria-describedby="tip-home">Home</a>
                <span class="tooltip" id="tip-home" role="tooltip">This is the home page</span>
            </li>

            <li class="tip-slide">
                <a href="#" class="nav-item" aria-describedby="tip-project">Projects</a>
                <span class="tooltip" id="tip-project" role="tooltip">Here is everything I have built</span>
            </li>

            <li class="tip-scale">
                <a href="#" class="nav-item" aria-describedby="tip-blog">Blog</a>
                <span class="tooltip" id="tip-blog" role="tooltip">Notes on what I'm learning</span>
            </li>
        </ul>
    </div>
    
</body>
</html>
